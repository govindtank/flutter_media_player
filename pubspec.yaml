name: flutter_media_player
description: "A Flutter app demonstrating multi-format media playback: audio, video, YouTube, and YouTube Shorts."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  provider: ^6.1.5+1
  just_audio: ^0.10.6
  video_player: ^2.14.0
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
