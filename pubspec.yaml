name: audio_video_youtube_player
description: "A Flutter app demonstrating multi-format media playback: audio, video, YouTube, and YouTube Shorts."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  provider: ^6.1.5+1
  just_audio: ^0.10.6
  video_player: ^2.14.0
  youtube_player_iframe: ^6.0.2
  tiktoklikescroller: ^0.2.8
  audio_service: ^0.18.19
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^1.1.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1A1A2E"
  image: assets/images/splash.png
  android_12:
    color: "#1A1A2E"
    image: assets/images/splash.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
